<script>
(function(){

  else if(/^\/(?:products\/(?:site|siteecommerce|site-de-apresentacao-google-sites(?:-copia)?)|collections\/sites(?:\/sites-e-lojas-e-commerce)?|site)$/.test(clean))t=lang+"/orcamento/#site";
  else if(/^\/(?:pages\/(?:sobre|quemsou)|sobre|about)$/.test(clean))t=lang+"/sobre/";
  else if(clean==="/portfolio")t=lang+"/portfolio/";

})();
